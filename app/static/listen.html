<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TST Indonesia · Live Interpreter</title>
<style>
:root{--y:#ffd700;--y2:#c9a800;--blue:#144980;--blue2:#0b2d52;--bg:#000;--card:#0e0e0e;--edge:#262626;--text:#f4f4f4;--dim:#9a9a9a;--green:#3ddc84;--red:#ff4d4d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{min-height:100vh;color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
 background:radial-gradient(900px 500px at 50% -10%,#1a2a44 0%,transparent 65%),#000;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:460px;margin:0 auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px;border-bottom:2px solid var(--y)}
header img{height:40px;display:block;mix-blend-mode:screen}
.tag{text-align:right;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);font-weight:700;line-height:1.3}
.tag small{display:block;color:var(--dim);font-weight:500;letter-spacing:.08em}
.rx{background:linear-gradient(180deg,#171717,#0a0a0a);border:1px solid var(--edge);border-radius:22px;padding:14px;box-shadow:0 12px 40px #000a,inset 0 1px 0 #ffffff12}
.lcd{background:linear-gradient(180deg,#165a9e,var(--blue2));border:1px solid #2b6fb5;border-radius:14px;padding:14px 16px 12px;box-shadow:inset 0 0 30px #0007,inset 0 1px 0 #ffffff25}
.r1{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#bcd6f2;font-weight:600}
.pill{display:flex;align-items:center;gap:7px;background:#00000040;border-radius:999px;padding:4px 10px 4px 8px}
.led{width:9px;height:9px;border-radius:50%;background:#6b7a8c;flex:none}
.pill.on .led{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.wait .led{background:var(--y);box-shadow:0 0 8px var(--y)}
.pill.err .led{background:var(--red);box-shadow:0 0 8px var(--red)}
.pill.on.pulse .led{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.r2{display:flex;align-items:center;gap:16px;margin:8px 0 10px}
.num{font:800 76px/1 ui-monospace,Consolas,"Courier New",monospace;color:var(--y);text-shadow:0 0 18px #ffd70055;font-variant-numeric:tabular-nums;min-width:1.7ch}
.nm{min-width:0}
.nm b{display:block;font-size:28px;line-height:1.15;font-weight:700;overflow-wrap:anywhere}
.nm span{display:block;font-size:13px;color:#bcd6f2;letter-spacing:.06em;margin-top:2px}
.vu{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;height:12px}
.vu i{background:#ffffff1c;border-radius:2px;transition:background .06s}
.vu i.on{background:var(--y);box-shadow:0 0 6px #ffd70088}
.vu i.on.hi{background:#fff}
.vl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#8fb2d6;margin-top:5px;text-transform:uppercase}
.ctl{display:grid;grid-template-columns:56px 56px 1fr 56px;gap:10px;align-items:center;margin-top:14px}
.kb{height:52px;border-radius:14px;border:1px solid #333;background:linear-gradient(180deg,#242424,#141414);display:grid;place-items:center;font-size:20px;font-weight:700;box-shadow:inset 0 1px 0 #ffffff14}
.kb:active{transform:translateY(1px);background:#1a1a1a}
.kb svg{width:24px;height:24px;fill:currentColor}
.kb.on{background:var(--red);border-color:#ff7b7b;color:#fff}
.vol{display:flex;align-items:center;gap:8px;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--y) var(--p,80%),#333 var(--p,80%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#333}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--y)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--y);margin-top:-9px;box-shadow:0 2px 8px #000}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--y)}
h2{margin:6px 2px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--y);font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--dim);letter-spacing:.04em;text-transform:none;font-weight:500;font-size:12px}
#l{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;min-height:64px}
.ch .n{flex:none;width:40px;height:40px;border-radius:10px;background:#1c1c1c;border:1px solid #333;display:grid;place-items:center;font:800 18px ui-monospace,Consolas,monospace;color:var(--y)}
.ch .t{flex:1;min-width:0}.ch .t b{display:block;font-size:18px;font-weight:700}.ch .t small{color:var(--dim);font-size:12px;letter-spacing:.06em}
.ch .eq{display:none;gap:3px;align-items:flex-end;height:20px}
.ch .eq i{width:4px;background:#000;border-radius:1px;animation:eq 0.9s ease-in-out infinite}
.ch .eq i:nth-child(2){animation-delay:.2s}.ch .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:20px}}
.ch:active{background:#161616}
.ch.on{background:var(--y);border-color:var(--y);color:#000}
.ch.on .n{background:#000;border-color:#000}.ch.on .t small{color:#4a3f00}.ch.on .eq{display:flex}
.cap{background:var(--card);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
.caph{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--edge);gap:8px}
.caph span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.caph div{display:flex;gap:6px}
.sm{min-width:40px;height:34px;border-radius:9px;border:1px solid #333;background:#181818;font-weight:700;font-size:13px;padding:0 10px}
.sm.on{background:var(--y);color:#000;border-color:var(--y)}
#tx{padding:16px 16px 18px;min-height:110px;font-size:var(--fs,22px);line-height:1.4;font-weight:500;overflow-wrap:anywhere}
#tx p{margin:0 0 10px}#tx p:last-child{margin-bottom:0}#tx p.old{color:#8f8f8f;font-size:.78em;font-weight:400}
.rtag{font-style:normal;margin-left:8px;background:var(--y);color:#000;border-radius:6px;padding:2px 8px;font-size:10px;letter-spacing:.08em}.rtag[hidden]{display:none}
#tx.empty{color:#5a5a5a;font-size:15px}
.cap.off #tx,.cap.off .caph div .fs{display:none}
.cap.off .caph{border-bottom:0}
footer{text-align:center;color:#6b6b6b;font-size:11px;letter-spacing:.06em;line-height:1.7;padding-top:4px}
footer b{color:var(--y);font-weight:600}
@media(max-width:360px){.num{font-size:60px}.nm b{font-size:22px}.ctl{grid-template-columns:48px 48px 1fr 48px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

   </div>
   <div class="vu" id="vu"></div>
   <div class="vl"><span>Audio level</span><span id="pk">–</span></div>
  </div>
  <div class="ctl">
   <button class="kb" id="prev" aria-label="Previous channel"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 8.8 12l6.6 6.6L14 20l-8-8 8-8z"/></svg></button>
   <button class="kb" id="next" aria-label="Next channel"><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>
   <div class="vol"><input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"></div>
   <button class="kb" id="mute" aria-label="Mute" aria-pressed="false"><svg id="ico" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  </div>
 </section>

 <h2>Channels <small>Pilih bahasa · Plug in your headset</small></h2>
 <div id="l"></div>

 <h2>Live Captions</h2>
 <section class="cap" id="cap">
  <div class="caph"><span>Teks / Text <em class="rtag" id="rl" hidden></em></span>
   <div><button class="sm fs" id="fm" aria-label="Smaller text">A−</button><button class="sm fs" id="fp" aria-label="Larger text">A+</button><button class="sm on" id="ct" aria-pressed="true">ON</button></div>
  </div>
  <div id="tx" class="empty">Teks terjemahan akan muncul di sini.</div>
 </section>

 <footer>Powered by <b>TAIDEN</b> · TST Indonesia<br><span id="dbg">Audio: –</span></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const V={ENG:"en-US",IND:"id-ID",CHI:"zh-CN",ARA:"ar-SA",JPN:"ja-JP"};
const N={FLR:"Floor",ENG:"English",IND:"Indonesia",CHI:"中文",ARA:"العربية",JPN:"日本語"};
const E={FLR:"Original · suara pembicara",ENG:"English",IND:"Bahasa Indonesia",CHI:"Mandarin Chinese",ARA:"Arabic",JPN:"Japanese"};
const K=Object.keys(N);
let ac,gain,ws,nx=0,cur,pk=0,lvl=0,lastPkt=0,vol=.8,muted=false,capOn=true,fs=22;
const store={get(k,d){try{const v=localStorage.getItem("tst_"+k);return v===null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem("tst_"+k,JSON.stringify(v))}catch(_){}}};
vol=store.get("vol",.8);capOn=store.get("cap",true);fs=store.get("fs",22);

// channel list
$("l").innerHTML=K.map((c,i)=>`<button class="ch" data-c="${c}" aria-pressed="false"><span class="n">${i}</span><span class="t"><b dir="auto">${N[c]}</b><small>${E[c]} · ${c}</small></span><span class="eq"><i></i><i></i><i></i></span></button>`).join("");
$("l").onclick=e=>{const b=e.target.closest(".ch");if(b)join(b.dataset.c)};
// VU
$("vu").innerHTML="<i></i>".repeat(16);const segs=[...$("vu").children];
function paintVU(v){const n=Math.round(Math.min(1,v)*16);segs.forEach((s,i)=>s.className=i<n?(i>12?"on hi":"on"):"")}
// status
function status(t,cls,pulse){$("pt").textContent=t;$("pill").className="pill "+(cls||"")+(pulse?" pulse":"")}
// volume/mute
function applyVol(){const g=muted?0:vol;if(gain)gain.gain.value=g*g*1.4;$("vol").value=Math.round(vol*100);$("vol").style.setProperty("--p",Math.round(vol*100)+"%");
 $("mute").classList.toggle("on",muted);$("mute").setAttribute("aria-pressed",muted);
 $("ico").innerHTML=muted?'<path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a7 7 0 0 1-.9 3.4l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.2 4.2c-.7.5-1.4.9-2.2 1.1v2.1a9 9 0 0 0 3.6-1.8l2.1 2.1L21 19.7l-9-9L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/>':'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>'}
$("vol").oninput=e=>{vol=e.target.value/100;if(vol>0)muted=false;store.set("vol",vol);applyVol()};
$("mute").onclick=()=>{muted=!muted;applyVol();if(muted)try{speechSynthesis.cancel()}catch(_){}};
// captions
function applyCap(){$("cap").classList.toggle("off",!capOn);$("ct").textContent=capOn?"ON":"OFF";$("ct").classList.toggle("on",capOn);$("ct").setAttribute("aria-pressed",capOn);document.documentElement.style.setProperty("--fs",fs+"px")}
$("ct").onclick=()=>{capOn=!capOn;store.set("cap",capOn);applyCap()};
$("fp").onclick=()=>{fs=Math.min(40,fs+3);store.set("fs",fs);applyCap()};
$("fm").onclick=()=>{fs=Math.max(16,fs-3);store.set("fs",fs);applyCap()};
// captions: 3 baris terakhir, baris terbaru paling terang
let capLines=[];
function renderCap(){const el=$("tx");el.textContent="";
 if(!capLines.length){el.className="empty";el.textContent=cur?(cur=="FLR"?"Menunggu pembicara…":"Menunggu penerjemah…"):"Teks terjemahan akan muncul di sini.";$("rl").hidden=true;return}
 el.className="";capLines.forEach((l,i)=>{const p=document.createElement("p");p.textContent=l.t;p.className=i==capLines.length-1?"cur":"old";el.appendChild(p)});
 const v=capLines[capLines.length-1].via;$("rl").hidden=!v;if(v)$("rl").textContent="RELAY ← "+(N[v]||v)}
// prev/next
const step=d=>join(K[((cur?K.indexOf(cur):d>0?-1:0)+d+K.length)%K.length]);
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);

function show(c){
 const i=K.indexOf(c);$("num").textContent=String(i).padStart(2,"0");$("nmn").textContent=N[c];$("nme").textContent=E[c];
 [...$("l").children].forEach(b=>{const on=b.dataset.c==c;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
}
function join(c){
 if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.connect(ac.destination)}
 ac.resume();applyVol();
 try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(_){}
 const changed=cur!==c;cur=c;if(changed){capLines=[];renderCap();nx=0}
 if(ws){ws.onclose=null;ws.close()}
 show(c);status("Connecting","wait");
 navigator.wakeLock?.request("screen").catch(()=>{});
 ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws/listen?ch="+c);ws.binaryType="arraybuffer";
 ws.onopen=()=>status("Connected","on");
 ws.onclose=()=>{status("Reconnecting…","err");setTimeout(()=>cur==c&&join(c),1500)};
 ws.onmessage=e=>{
  if(typeof e.data=="string"){const d=JSON.parse(e.data);
   if(d.type=="tx"){capLines.push({t:d.text,via:d.via});capLines=capLines.slice(-3);renderCap();
    if(d.speak!==false&&!muted&&cur!="FLR")try{const u=new SpeechSynthesisUtterance(d.text);u.lang=V[cur];u.volume=vol;speechSynthesis.speak(u)}catch(_){}}
   return}
  pk++;lastPkt=performance.now();
  const p=new Int16Array(e.data),f=new Float32Array(p.length);let s2=0;
  for(let i=0;i<p.length;i++){const v=p[i]/32768;f[i]=v;s2+=v*v}
  lvl=Math.max(lvl,Math.min(1,Math.sqrt(s2/p.length)*4));
  const b=ac.createBuffer(1,f.length,16000);b.copyToChannel(f,0);const s=ac.createBufferSource();s.buffer=b;s.connect(gain);
  const t=ac.currentTime;if(nx<t)nx=t+.15;s.start(nx);nx+=b.duration;
  $("dbg").textContent="Audio: "+ac.state+" · paket "+pk;
 }
}
// meter loop
(function loop(){const live=performance.now()-lastPkt<900;lvl*=.86;paintVU(muted?0:lvl);
 if(cur&&$("pill").classList.contains("on")){$("pt").textContent=live?"Live":"Connected";$("pill").classList.toggle("pulse",live)}
 $("pk").textContent=cur?(muted?"muted":Math.round(Math.min(1,lvl)*100)+"%"):"–";requestAnimationFrame(loop)})();
applyVol();applyCap();status("Standby");renderCap();
</script>
</body>
</html>
